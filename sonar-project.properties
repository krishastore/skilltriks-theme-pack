# =====================================================
# KrishaWeb — WordPress SonarQube Configuration
# =====================================================
# sonar.projectKey is deliberately NOT set here: the workflow passes
# -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}, so each repo targets its
# own SonarQube project without this file ever needing to change.
sonar.projectName=skilltriks-theme-pack

# Source paths (custom plugin code only — not vendor/build output).
# This repo IS the plugin, so we list our own code explicitly rather than
# scanning "." which would drag in vendor/, node_modules/ and build output.
#
# Unlike skilltriks / skilltriks-pro this repo has NO src/ directory: all PHP
# lives in the theme templates plus the two root files, and the only hand-written
# front-end sources are assets/layout-2/{js,scss}.
#
# Every entry must actually exist — the scanner treats a missing sonar.sources
# path as a fatal config error, so the plugin bootstrap file is named exactly.
sonar.sources=\
    templates,\
    assets,\
    skilltriks-theme-pack.php,\
    uninstall.php

# Language config omitted to allow multi-language scanning (PHP + JS + SCSS here).
# Exclusions
sonar.exclusions=\
    **/vendor/**,\
    **/node_modules/**,\
    **/*.min.js,\
    **/*.min.css,\
    **/*.map,\
    **/assets/**/css/**,\
    **/assets/**/images/**,\
    **/index.php

# CPD (duplication) exclusions
sonar.cpd.exclusions=\
    templates/layout-2/block-theme/courses-result.php,\
    templates/layout-2/assign-course-to-me.php,\
    templates/layout-2/assign-course-by-me.php,\
    templates/layout-2/courses.php,\
    templates/layout-2/block-theme/single-courses.php,\
    templates/layout-2/mylearning.php,\
    templates/layout-2/course-detail.php

sonar.test.exclusions=**/vendor/**,**/node_modules/**

# Encoding
sonar.sourceEncoding=UTF-8

# PHP file suffixes
sonar.php.file.suffixes=.php,.inc

# ── PHPCS Report Import (via Generic Issue Import) ───
sonar.externalIssuesReportPaths=reports/phpcs-sonar.json
